    <text x="440" y="305" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">Hybrid</text>
    <text x="440" y="333" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">Retrieval</text>
    <text x="440" y="365" fill="#93c5fd" font-size="16" text-anchor="middle">Pinecone + BM25</text>
    <text x="440" y="390" fill="#93c5fd" font-size="16" text-anchor="middle">fused with RRF</text>
  </g>
  <line x1="555" y1="337" x2="625" y2="337" stroke="#64748b" stroke-width="3" marker-end="url(#arrow2)"/>

  <g>
    <rect x="630" y="255" width="220" height="165" rx="16" fill="#132a1f" stroke="#22c55e" stroke-width="2.5"/>
    <text x="740" y="315" fill="#e2e8f0" font-size="21" font-weight="700" text-anchor="middle">FlashRank</text>
    <text x="740" y="343" fill="#e2e8f0" font-size="21" font-weight="700" text-anchor="middle">+ Self-RAG</text>
    <text x="740" y="378" fill="#86efac" font-size="15" text-anchor="middle">rerank, grade, retry</text>
  </g>
  <line x1="850" y1="337" x2="920" y2="337" stroke="#64748b" stroke-width="3" marker-end="url(#arrow2)"/>

  <g>
    <rect x="925" y="255" width="215" height="165" rx="16" fill="#2a1f13" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="1032" y="305" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">LLM Answer</text>
    <text x="1032" y="333" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">+ Citations</text>
    <text x="1032" y="365" fill="#fbbf24" font-size="16" text-anchor="middle">1.000 faithfulness</text>
    <text x="1032" y="390" fill="#fbbf24" font-size="16" text-anchor="middle">Ragas-evaluated</text>
  </g>

  <!-- Metric badge -->
