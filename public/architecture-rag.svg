<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>

  <text x="60" y="70" fill="#64748b" font-size="22" letter-spacing="3">FINANCIAL RAG ENGINE &#183; FIN-RAG</text>
  <rect x="60" y="86" width="160" height="4" rx="2" fill="url(#accent2)"/>

  <!-- Pipeline row -->
  <g>
    <rect x="60" y="270" width="190" height="135" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="155" y="325" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">10-K</text>
    <text x="155" y="353" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">Filings</text>
    <text x="155" y="380" fill="#94a3b8" font-size="15" text-anchor="middle">contextual chunks</text>
  </g>
  <line x1="250" y1="337" x2="320" y2="337" stroke="#64748b" stroke-width="3" marker-end="url(#arrow2)"/>

