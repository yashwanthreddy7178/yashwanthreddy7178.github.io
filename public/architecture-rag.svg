    <rect x="440" y="470" width="320" height="90" rx="45" fill="#0f2e1a" stroke="#22c55e" stroke-width="2.5"/>
    <text x="600" y="510" fill="#4ade80" font-size="26" font-weight="800" text-anchor="middle">5 days &#183; solo &#183; v2.0.0</text>
    <text x="600" y="536" fill="#86efac" font-size="16" text-anchor="middle">empty repo to self-grading retrieval</text>
