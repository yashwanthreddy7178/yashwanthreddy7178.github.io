<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)"/>

  <text x="60" y="70" fill="#64748b" font-size="22" letter-spacing="3">LLM OBSERVABILITY &#183; MONITORING</text>
  <rect x="60" y="86" width="160" height="4" rx="2" fill="url(#accent3)"/>

  <!-- Trace spans -->
  <g>
    <rect x="60" y="150" width="1080" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="90" y="188" fill="#94a3b8" font-size="18">RAG Query &#8594; Langfuse Trace</text>
    <rect x="420" y="160" width="190" height="40" rx="8" fill="#132036" stroke="#3b82f6" stroke-width="2"/>
    <text x="515" y="186" fill="#93c5fd" font-size="16" text-anchor="middle">retrieval</text>
    <rect x="625" y="160" width="190" height="40" rx="8" fill="#132a1f" stroke="#22c55e" stroke-width="2"/>
    <text x="720" y="186" fill="#86efac" font-size="16" text-anchor="middle">rerank</text>
    <rect x="830" y="160" width="220" height="40" rx="8" fill="#2a1f13" stroke="#f59e0b" stroke-width="2"/>
    <text x="940" y="186" fill="#fbbf24" font-size="16" text-anchor="middle">generation</text>
  </g>

  <line x1="600" y1="210" x2="600" y2="270" stroke="#64748b" stroke-width="3" marker-end="url(#arrow3)"/>

  <!-- Prometheus -->
  <g>
    <rect x="110" y="280" width="330" height="150" rx="16" fill="#132036" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="275" y="330" fill="#e2e8f0" font-size="24" font-weight="700" text-anchor="middle">Prometheus</text>
    <text x="275" y="360" fill="#93c5fd" font-size="17" text-anchor="middle">p50 / p95 latency</text>
    <text x="275" y="385" fill="#93c5fd" font-size="17" text-anchor="middle">token cost per query</text>
    <text x="275" y="410" fill="#93c5fd" font-size="17" text-anchor="middle">quality scores</text>
  </g>

  <!-- Grafana -->
  <g>
    <rect x="470" y="280" width="330" height="150" rx="16" fill="#132a1f" stroke="#22c55e" stroke-width="2.5"/>
    <text x="635" y="330" fill="#e2e8f0" font-size="24" font-weight="700" text-anchor="middle">Grafana</text>
    <polyline points="510,400 560,375 610,395 660,360 710,385 760,350" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="635" y="418" fill="#86efac" font-size="16" text-anchor="middle">live dashboards</text>
  </g>

  <!-- CI Gate -->
  <g>
    <rect x="830" y="280" width="220" height="150" rx="16" fill="#2a1f13" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="940" y="330" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">CI Gate</text>
    <text x="940" y="360" fill="#fbbf24" font-size="16" text-anchor="middle">blocks deploy on</text>
    <text x="940" y="384" fill="#fbbf24" font-size="16" text-anchor="middle">latency spike or</text>
    <text x="940" y="408" fill="#fbbf24" font-size="16" text-anchor="middle">eval regression</text>
  </g>

  <line x1="440" y1="355" x2="465" y2="355" stroke="#64748b" stroke-width="3" marker-end="url(#arrow3)"/>
  <line x1="800" y1="355" x2="825" y2="355" stroke="#64748b" stroke-width="3" marker-end="url(#arrow3)"/>

  <text x="60" y="620" fill="#475569" font-size="17">FastAPI service &#183; GitHub Actions &#183; full trace-to-deploy regression gating</text>
</svg>
